[licenses]
version = 2
confidence-threshold = 0.8
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "NCSA",
  "Unicode-3.0",
  "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[advisories]
version = 2
# Both are unmaintained (not vulnerability/unsoundness) notices in the current
# iced/image graph, with no compatible patched release. Keep these exact IDs
# aligned with .cargo/audit.toml so any different advisory still fails closed.
ignore = [
  "RUSTSEC-2024-0436", # paste, through image/rav1e and macOS wgpu support
  "RUSTSEC-2026-0192", # ttf-parser, through cosmic-text/fontdb
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = [
  "https://github.com/beamiter/jagent.git?rev=d5492320686879c8b92106d2e31e4293ff125a5a",
  "https://github.com/beamiter/jterm_core.git?rev=e2248efa440011431dff4290084d38fea36fe43f",
]
