name: IP boundary validation
on:
  push:
    branches: [diagnostics/ip-boundaries]
permissions:
  contents: read
jobs:
  links:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: bash scripts/materialize-shared-core.sh
      - run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y pkg-config libfontconfig1-dev libwayland-dev libx11-dev libx11-xcb-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxcursor-dev libxi-dev libxrandr-dev libxkbcommon-dev libegl1-mesa-dev libgl1-mesa-dev
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt,clippy

      - name: Original production must fail real parser regression
        run: |
          set +e
          CARGO_TERM_COLOR=never cargo test -p frost --all-features --locked link::tests::parsed_version_components_are_not_ip_links -- --exact --nocapture > /tmp/ip-negative.log 2>&1
          status=$?
          set -e
          cat /tmp/ip-negative.log
          test "$status" -ne 0
          grep -q 'parsed_version_components_are_not_ip_links ... FAILED' /tmp/ip-negative.log
      - name: Apply minimal IP boundary fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/link.rs')
          s = p.read_text()
          old = "        if self.config.detect_ip_addresses {\n            for mat in self.ip_regex.find_iter(line) {"
          new = "        if self.config.detect_ip_addresses {\n            let bytes = line.as_bytes();\n            for mat in self.ip_regex.find_iter(line) {\n                // A four-component substring of a longer dotted sequence is\n                // not an IPv4 address (for example a five-part version).\n                if mat.start() > 0 && bytes[mat.start() - 1] == b'.' {\n                    continue;\n                }\n                if bytes.get(mat.end()) == Some(&b'.')\n                    && bytes.get(mat.end() + 1).is_some_and(|b| b.is_ascii_digit())\n                {\n                    continue;\n                }"
          assert s.count(old) == 1
          p.write_text(s.replace(old, new))
          PY
          rustfmt --edition 2021 src/link.rs
          echo 'FORMATTED_IP_BEGIN'
          base64 -w0 src/link.rs
          printf '\nFORMATTED_IP_END\n'
      - name: Full link regression suite
        run: cargo test -p frost --all-features --locked link::tests -- --nocapture
      - name: Clippy candidate
        run: cargo clippy -p frost --all-targets --all-features --locked -- -D warnings
