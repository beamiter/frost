name: Native conversation layout

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ui-layout-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  native-layout:
    name: Native capsule, composer, and viewport geometry
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Materialize bundled shared core
        run: bash scripts/materialize-shared-core.sh

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            pkg-config fonts-dejavu-core fonts-noto-cjk \
            libfontconfig1-dev libwayland-dev libx11-dev libx11-xcb-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxcursor-dev libxi-dev libxrandr-dev libxkbcommon-dev \
            libegl1-mesa-dev libgl1-mesa-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c

      - name: Cache build data
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          shared-key: tests

      - name: Compile production application tests
        run: cargo test --bin frost --all-features --locked --no-run

      - name: Check native command, caret, and viewport contracts
        run: |
          set -euo pipefail
          suites=(
            chat_mode::tests::
            terminal::chat_projection::tests::
            native_input_surface::tests::
            terminal_view::chat_capsule_geometry_tests::
            terminal_view::chat_card_action_tests::
            terminal_view::mode_gesture_tests::
            glass_layout::tests::
          )
          listed_tests="$(cargo test --bin frost --all-features --locked -- --list)"
          failed=0
          for suite in "${suites[@]}"; do
            if ! grep -Fq "$suite" <<< "$listed_tests"; then
              printf 'Required UI suite not found: %s\n' "$suite" >&2
              failed=1
              continue
            fi
            if ! cargo test --bin frost --all-features --locked "$suite" -- --test-threads=2; then
              failed=1
            fi
          done
          exit "$failed"
