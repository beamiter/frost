name: Native provider acceptance
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-provider-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-provider:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      RUST_BACKTRACE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install official native fixture packages
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y pkg-config libwayland-dev libwayland-bin libxkbcommon-dev libx11-dev libx11-xcb-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libegl1-mesa-dev xvfb x11-utils sway wtype wl-clipboard grim
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Verify frozen source and dependency identities
        run: |
          set -euo pipefail
          mkdir -p native-provider-artifacts
          git rev-parse HEAD > native-provider-artifacts/commit.txt
          python3 scripts/verify-provider-sources.py 2>&1 | tee native-provider-artifacts/source-verification.log
      - name: Build real host and native test executables
        run: |
          set -euo pipefail
          mkdir -p native-provider-artifacts "$RUNNER_TEMP/provider-owner"
          exec > >(tee native-provider-artifacts/build.log) 2>&1
          python3 scripts/prepare-provider-tests.py --output "$RUNNER_TEMP/frost-smithay-tests"
          cp "$RUNNER_TEMP/frost-smithay-tests/source-identity.json" native-provider-artifacts/smithay-source-identity.json
          cp "$RUNNER_TEMP/frost-smithay-tests/Cargo.toml" native-provider-artifacts/smithay-workspace.toml
          cp scripts/provider-acceptance/smithay-tests.lock native-provider-artifacts/smithay-tests.lock
          cargo build --locked --manifest-path scripts/provider-acceptance/Cargo.toml
          cargo test --locked --manifest-path scripts/provider-acceptance/Cargo.toml -p clipboard_x11 --lib --no-run
          cargo test --locked --manifest-path "$RUNNER_TEMP/frost-smithay-tests/Cargo.toml" -p smithay-clipboard --lib --no-run
          wayland-scanner client-header scripts/protocols/wlr-data-control-unstable-v1.xml "$RUNNER_TEMP/provider-owner/wlr-data-control-unstable-v1-client-protocol.h"
          wayland-scanner private-code scripts/protocols/wlr-data-control-unstable-v1.xml "$RUNNER_TEMP/provider-owner/wlr-data-control-unstable-v1-protocol.c"
          cc -Wall -Wextra -Werror $(pkg-config --cflags wayland-client) -I"$RUNNER_TEMP/provider-owner" scripts/native-clipboard-owner.c "$RUNNER_TEMP/provider-owner/wlr-data-control-unstable-v1-protocol.c" $(pkg-config --libs wayland-client) -o "$RUNNER_TEMP/provider-owner/owner"
          sha256sum scripts/provider-acceptance/target/debug/frost-provider-acceptance "$RUNNER_TEMP/provider-owner/owner" > native-provider-artifacts/binaries.sha256
          cargo tree --locked --manifest-path scripts/provider-acceptance/Cargo.toml > native-provider-artifacts/cargo-tree.txt
          cargo tree --locked --manifest-path "$RUNNER_TEMP/frost-smithay-tests/Cargo.toml" -e features > native-provider-artifacts/smithay-test-features.txt
          find "$RUNNER_TEMP/frost-smithay-tests/target/debug/deps" -maxdepth 1 -type f -name 'smithay_clipboard-*' -executable -exec sha256sum {} + > native-provider-artifacts/smithay-test-binaries.sha256
      - name: Run all five ignored native provider tests
        run: |
          set -euo pipefail
          export RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}" CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}"
          export HOME="$RUNNER_TEMP/provider-native-home"
          mkdir -p "$HOME" "$RUNNER_TEMP/provider-native-runtime"
          chmod 700 "$RUNNER_TEMP/provider-native-runtime"
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/provider-native-runtime"
          unset WAYLAND_DISPLAY WAYLAND_SOCKET
          Xvfb :97 -screen 0 640x480x24 -nolisten tcp > native-provider-artifacts/xvfb.log 2>&1 &
          server=$!
          trap 'kill "$server"; wait "$server" || true' EXIT
          export FROST_X11_TEST_DISPLAY=:97
          for i in $(seq 1 50); do DISPLAY=:97 xdpyinfo >/dev/null 2>&1 && break; sleep .1; done
          DISPLAY=:97 xdpyinfo >/dev/null
          timeout 90 cargo test --locked --manifest-path scripts/provider-acceptance/Cargo.toml -p clipboard_x11 --lib -- --ignored --test-threads=1 --nocapture 2>&1 | tee native-provider-artifacts/x11-tests.log
          grep -q '3 passed; 0 failed' native-provider-artifacts/x11-tests.log
          timeout 30 cargo test --locked --manifest-path "$RUNNER_TEMP/frost-smithay-tests/Cargo.toml" -p smithay-clipboard --lib -- --ignored --test-threads=1 --nocapture 2>&1 | tee native-provider-artifacts/wayland-tests.log
          grep -q '2 passed; 0 failed' native-provider-artifacts/wayland-tests.log
      - name: Exercise real winit host on disposable Sway
        run: |
          timeout 120 python3 scripts/native-provider-acceptance.py --runner scripts/native-desktop-smoke.py --binary scripts/provider-acceptance/target/debug/frost-provider-acceptance --owner "$RUNNER_TEMP/provider-owner/owner" --output native-provider-artifacts/wayland
      - name: Preserve native evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frost-provider-acceptance-${{ github.sha }}
          path: native-provider-artifacts
          if-no-files-found: error
          retention-days: 14
