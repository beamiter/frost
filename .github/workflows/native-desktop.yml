name: Native desktop smoke

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop-smoke:
    name: X11 and Wayland installed release smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      RUST_BACKTRACE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Materialize bundled shared core
        shell: bash
        run: |
          if [[ -f "scripts/materialize-shared-core.sh" ]]; then
            bash "scripts/materialize-shared-core.sh"
          fi
      - name: Install official desktop and build packages
        timeout-minutes: 6
        run: |
          # The runner's Azure mirror stalled large fonts/Mesa downloads until
          # the whole native job expired. Keep Ubuntu's signed packages and
          # exact dependency list, but prefer its official HTTPS archives.
          if [[ -f /etc/apt/apt-mirrors.txt ]]; then
            printf 'https://archive.ubuntu.com/ubuntu/\tpriority:1\nhttps://security.ubuntu.com/ubuntu/\tpriority:2\n' \
              | sudo tee /etc/apt/apt-mirrors.txt
          else
            echo "::notice::APT mirror list absent; retaining configured sources with bounded retries/timeouts."
          fi
          apt_network=(-o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          sudo apt-get "${apt_network[@]}" update
          sudo apt-get "${apt_network[@]}" install --no-install-recommends -y \
            pkg-config libfontconfig1-dev libwayland-dev libx11-dev libx11-xcb-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxcursor-dev libxi-dev libxrandr-dev libxkbcommon-dev \
            libxkbcommon-x11-0 libegl1-mesa-dev libgl1-mesa-dev mesa-vulkan-drivers fonts-dejavu-core fonts-noto-cjk \
            xvfb openbox xdotool xclip x11-utils sway wtype wl-clipboard grim imagemagick python3-xlib libwayland-bin tesseract-ocr
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Cache native build dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: native-desktop-release
          cache-on-failure: true
      - name: Check exact clipboard observation contracts
        run: |
          python3 scripts/test-native-clipboard-observation.py
          python3 scripts/test-native-desktop-navigation.py
          python3 scripts/test-native-mission-observation.py
      - name: Build production binary
        run: cargo build --release --locked --bin frost
      - name: Stage installed application
        id: install
        run: |
          mkdir -p "$RUNNER_TEMP/frost-install-home"
          export HOME="$RUNNER_TEMP/frost-install-home"
          export XDG_CONFIG_HOME="$HOME/.config" XDG_DATA_HOME="$HOME/.local/share"
          export XDG_STATE_HOME="$HOME/.local/state" XDG_CACHE_HOME="$HOME/.cache"
          bash scripts/install.sh --binary "$GITHUB_WORKSPACE/target/release/frost" --prefix "$RUNNER_TEMP/frost-installed"
          cmp "$GITHUB_WORKSPACE/target/release/frost" "$RUNNER_TEMP/frost-installed/bin/frost"
          sha256sum "$GITHUB_WORKSPACE/target/release/frost" "$RUNNER_TEMP/frost-installed/bin/frost"
      - name: Record native environment
        if: always()
        run: |
          mkdir -p native-smoke-artifacts
          { uname -a; rustc -Vv; dpkg-query -W xvfb sway wtype wl-clipboard libvulkan1 mesa-vulkan-drivers fonts-dejavu-core fonts-noto-cjk openbox; sway --version; fc-match monospace; git rev-parse HEAD; } > native-smoke-artifacts/environment.txt
      - name: Check production-derived native geometry oracle
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          python3 scripts/test-geometry-artifacts.py
          FROST_SCALE_PROBE="$(PYTHONPATH=scripts python3 -c 'import native_scale_geometry as g; print(g.build_probe("native-smoke-artifacts/geometry-contract"))')"
          export FROST_SCALE_PROBE
          python3 scripts/test-native-scale-geometry.py
      - name: Build public Wayland pointer for observed close dialogs
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          mkdir -p "$RUNNER_TEMP/frost-pointer"
          wayland-scanner client-header scripts/protocols/wlr-virtual-pointer-unstable-v1.xml "$RUNNER_TEMP/frost-pointer/wlr-virtual-pointer-unstable-v1-client-protocol.h"
          wayland-scanner private-code scripts/protocols/wlr-virtual-pointer-unstable-v1.xml "$RUNNER_TEMP/frost-pointer/wlr-virtual-pointer-unstable-v1-protocol.c"
          cc -Wall -Wextra -Werror $(pkg-config --cflags wayland-client) -I"$RUNNER_TEMP/frost-pointer" scripts/native-pointer.c "$RUNNER_TEMP/frost-pointer/wlr-virtual-pointer-unstable-v1-protocol.c" $(pkg-config --libs wayland-client) -o "$RUNNER_TEMP/frost-pointer/native-pointer"
          echo "FROST_SMOKE_POINTER=$RUNNER_TEMP/frost-pointer/native-pointer" >> "$GITHUB_ENV"
      - name: Diagnose complete Wayland recovery sequence
        timeout-minutes: 6
        env:
          FROST_SMOKE_WAYLAND_DEBUG: '1'
        run: python3 scripts/native-recovery-report.py --runner scripts/native-desktop-smoke.py --binary "$RUNNER_TEMP/frost-installed/bin/frost" --backend wayland --pointer "$FROST_SMOKE_POINTER" --output native-smoke-artifacts/wayland-recovery-report
      - name: Diagnose bounded repetitions of the failing case
        timeout-minutes: 8
        env:
          FROST_SMOKE_WAYLAND_DEBUG: '1'
        run: python3 scripts/diagnose-close.py "$RUNNER_TEMP/frost-installed/bin/frost" "$FROST_SMOKE_POINTER" native-smoke-artifacts/close-repetitions
      - name: Preserve close diagnostic evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: frost-close-diagnostic-${{ github.sha }}
          path: native-smoke-artifacts
