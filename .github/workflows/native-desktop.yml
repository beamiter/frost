name: Native desktop smoke

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop-smoke:
    name: X11 and Wayland functional smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      RUST_BACKTRACE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install official desktop and build packages
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            pkg-config libfontconfig1-dev libwayland-dev libx11-dev libx11-xcb-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxcursor-dev libxi-dev libxrandr-dev libxkbcommon-dev \
            libxkbcommon-x11-0 libegl1-mesa-dev libgl1-mesa-dev mesa-vulkan-drivers fonts-dejavu-core \
            xvfb openbox xdotool xclip x11-utils sway wtype wl-clipboard grim imagemagick
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Cache native build dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: native-desktop-debug
          cache-on-failure: true
      - name: Build production binary
        run: cargo build --locked --bin frost
      - name: Stage installed application
        id: install
        run: |
          mkdir -p "$RUNNER_TEMP/frost-install-home"
          export HOME="$RUNNER_TEMP/frost-install-home"
          export XDG_CONFIG_HOME="$HOME/.config" XDG_DATA_HOME="$HOME/.local/share"
          export XDG_STATE_HOME="$HOME/.local/state" XDG_CACHE_HOME="$HOME/.cache"
          bash scripts/install.sh --binary "$GITHUB_WORKSPACE/target/debug/frost" --prefix "$RUNNER_TEMP/frost-installed"
      - name: Record native environment
        if: always()
        run: |
          mkdir -p native-smoke-artifacts
          { uname -a; rustc -Vv; dpkg-query -W xvfb sway wtype wl-clipboard libvulkan1 mesa-vulkan-drivers fonts-dejavu-core openbox; sway --version; fc-match monospace; git rev-parse HEAD; } > native-smoke-artifacts/environment.txt
      - name: Exercise X11 production input
        if: steps.install.outcome == 'success'
        run: python3 scripts/native-desktop-smoke.py --binary "$RUNNER_TEMP/frost-installed/bin/frost" --backend x11 --output native-smoke-artifacts/x11
      - name: Exercise Wayland production input
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python3 scripts/native-desktop-smoke.py --binary "$RUNNER_TEMP/frost-installed/bin/frost" --backend wayland --output native-smoke-artifacts/wayland
      - name: Preserve screenshots and PTY evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frost-native-desktop-${{ github.sha }}
          path: native-smoke-artifacts
          if-no-files-found: error
          retention-days: 14
