name: Native desktop smoke

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop-smoke:
    name: X11 and Wayland installed release smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      RUST_BACKTRACE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Materialize bundled shared core
        shell: bash
        run: |
          if [[ -f "scripts/materialize-shared-core.sh" ]]; then
            bash "scripts/materialize-shared-core.sh"
          fi
      - name: Install official desktop and build packages
        timeout-minutes: 6
        run: |
          # The runner's Azure mirror stalled large fonts/Mesa downloads until
          # the whole native job expired. Keep Ubuntu's signed packages and
          # exact dependency list, but prefer its official HTTPS archives.
          if [[ -f /etc/apt/apt-mirrors.txt ]]; then
            printf 'https://archive.ubuntu.com/ubuntu/\tpriority:1\nhttps://security.ubuntu.com/ubuntu/\tpriority:2\n' \
              | sudo tee /etc/apt/apt-mirrors.txt
          else
            echo "::notice::APT mirror list absent; retaining configured sources with bounded retries/timeouts."
          fi
          apt_network=(-o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          sudo apt-get "${apt_network[@]}" update
          sudo apt-get "${apt_network[@]}" install --no-install-recommends -y \
            pkg-config libfontconfig1-dev libwayland-dev libx11-dev libx11-xcb-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxcursor-dev libxi-dev libxrandr-dev libxkbcommon-dev \
            libxkbcommon-x11-0 libegl1-mesa-dev libgl1-mesa-dev mesa-vulkan-drivers fonts-dejavu-core fonts-noto-cjk \
            xvfb openbox xdotool xclip x11-utils sway wtype wl-clipboard grim imagemagick python3-xlib libwayland-bin tesseract-ocr
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Cache native build dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: native-desktop-release
          cache-on-failure: true
      - name: Check exact clipboard observation contracts
        run: |
          python3 scripts/test-native-clipboard-observation.py
          python3 scripts/test-close-diagnostics.py
          python3 scripts/test-native-desktop-navigation.py
          python3 scripts/test-native-mission-observation.py
      - name: Build production binary
        run: cargo build --release --locked --bin frost
      - name: Stage installed application
        id: install
        run: |
          mkdir -p "$RUNNER_TEMP/frost-install-home"
          export HOME="$RUNNER_TEMP/frost-install-home"
          export XDG_CONFIG_HOME="$HOME/.config" XDG_DATA_HOME="$HOME/.local/share"
          export XDG_STATE_HOME="$HOME/.local/state" XDG_CACHE_HOME="$HOME/.cache"
          bash scripts/install.sh --binary "$GITHUB_WORKSPACE/target/release/frost" --prefix "$RUNNER_TEMP/frost-installed"
          cmp "$GITHUB_WORKSPACE/target/release/frost" "$RUNNER_TEMP/frost-installed/bin/frost"
          sha256sum "$GITHUB_WORKSPACE/target/release/frost" "$RUNNER_TEMP/frost-installed/bin/frost"
      - name: Record native environment
        if: always()
        run: |
          mkdir -p native-smoke-artifacts
          { uname -a; rustc -Vv; dpkg-query -W xvfb sway wtype wl-clipboard libvulkan1 mesa-vulkan-drivers fonts-dejavu-core fonts-noto-cjk openbox; sway --version; fc-match monospace; git rev-parse HEAD; } > native-smoke-artifacts/environment.txt
      - name: Check production-derived native geometry oracle
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          python3 scripts/test-geometry-artifacts.py
          FROST_SCALE_PROBE="$(PYTHONPATH=scripts python3 -c 'import native_scale_geometry as g; print(g.build_probe("native-smoke-artifacts/geometry-contract"))')"
          export FROST_SCALE_PROBE
          python3 scripts/test-native-scale-geometry.py
      - name: Build public Wayland pointer for observed close dialogs
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          mkdir -p "$RUNNER_TEMP/frost-pointer"
          wayland-scanner client-header scripts/protocols/wlr-virtual-pointer-unstable-v1.xml "$RUNNER_TEMP/frost-pointer/wlr-virtual-pointer-unstable-v1-client-protocol.h"
          wayland-scanner private-code scripts/protocols/wlr-virtual-pointer-unstable-v1.xml "$RUNNER_TEMP/frost-pointer/wlr-virtual-pointer-unstable-v1-protocol.c"
          cc -Wall -Wextra -Werror $(pkg-config --cflags wayland-client) -I"$RUNNER_TEMP/frost-pointer" scripts/native-pointer.c "$RUNNER_TEMP/frost-pointer/wlr-virtual-pointer-unstable-v1-protocol.c" $(pkg-config --libs wayland-client) -o "$RUNNER_TEMP/frost-pointer/native-pointer"
          echo "FROST_SMOKE_POINTER=$RUNNER_TEMP/frost-pointer/native-pointer" >> "$GITHUB_ENV"
      - name: Exercise X11 visible Mission lifecycle
        timeout-minutes: 5
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python3 scripts/native-mission-smoke.py --binary "$RUNNER_TEMP/frost-installed/bin/frost" --backend x11 --output native-smoke-artifacts/x11-mission
      - name: Exercise Wayland visible Mission lifecycle
        timeout-minutes: 5
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python3 scripts/native-mission-smoke.py --binary "$RUNNER_TEMP/frost-installed/bin/frost" --backend wayland --output native-smoke-artifacts/wayland-mission
      - name: Preserve visible Mission evidence immediately
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frost-native-missions-${{ github.sha }}
          path: |
            native-smoke-artifacts/x11-mission
            native-smoke-artifacts/wayland-mission
          if-no-files-found: warn
          retention-days: 14
      - name: Exercise X11 production input
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python3 scripts/native-desktop-smoke.py --binary "$RUNNER_TEMP/frost-installed/bin/frost" --backend x11 --output native-smoke-artifacts/x11
      - name: Exercise Wayland production input
        timeout-minutes: 10
        env:
          FROST_SMOKE_WAYLAND_DEBUG: "1"
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python3 scripts/native-desktop-smoke.py --binary "$RUNNER_TEMP/frost-installed/bin/frost" --backend wayland --output native-smoke-artifacts/wayland
      - name: Exercise X11 restart and recovery
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python3 scripts/native-desktop-recovery.py --runner scripts/native-desktop-smoke.py --binary "$RUNNER_TEMP/frost-installed/bin/frost" --backend x11 --output native-smoke-artifacts/x11-recovery
      - name: Exercise Wayland recovery and fractional output scale
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python3 scripts/native-desktop-recovery.py --runner scripts/native-desktop-smoke.py --binary "$RUNNER_TEMP/frost-installed/bin/frost" --backend wayland --output native-smoke-artifacts/wayland-recovery
      - name: Characterize delayed synthetic clipboard latency
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python3 scripts/native-clipboard-latency.py --runner scripts/native-desktop-smoke.py --owner scripts/delayed-x11-clipboard.py --binary "$RUNNER_TEMP/frost-installed/bin/frost" --output native-smoke-artifacts/clipboard-latency
      - name: Build genuine Wayland IME protocol client
        id: ime
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          mkdir -p "$RUNNER_TEMP/frost-ime"
          wayland-scanner client-header scripts/protocols/input-method-unstable-v2.xml "$RUNNER_TEMP/frost-ime/input-method-unstable-v2-client-protocol.h"
          wayland-scanner private-code scripts/protocols/input-method-unstable-v2.xml "$RUNNER_TEMP/frost-ime/input-method-unstable-v2-protocol.c"
          cc -Wall -Wextra -Werror $(pkg-config --cflags wayland-client) -I"$RUNNER_TEMP/frost-ime" scripts/native-ime-client.c "$RUNNER_TEMP/frost-ime/input-method-unstable-v2-protocol.c" $(pkg-config --libs wayland-client) -o "$RUNNER_TEMP/frost-ime/native-ime-client"
      - name: Exercise actual Wayland preedit and commit
        if: ${{ !cancelled() && steps.ime.outcome == 'success' }}
        run: python3 scripts/native-ime-smoke.py --runner scripts/native-desktop-smoke.py --ime-client "$RUNNER_TEMP/frost-ime/native-ime-client" --binary "$RUNNER_TEMP/frost-installed/bin/frost" --output native-smoke-artifacts/wayland-ime
      - name: Build genuine Wayland clipboard owner and pointer
        id: clipboard_owner
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          mkdir -p "$RUNNER_TEMP/frost-clipboard"
          for protocol in wlr-data-control-unstable-v1 wlr-virtual-pointer-unstable-v1; do
            wayland-scanner client-header "scripts/protocols/$protocol.xml" "$RUNNER_TEMP/frost-clipboard/$protocol-client-protocol.h"
            wayland-scanner private-code "scripts/protocols/$protocol.xml" "$RUNNER_TEMP/frost-clipboard/$protocol-protocol.c"
          done
          cc -Wall -Wextra -Werror $(pkg-config --cflags wayland-client) -I"$RUNNER_TEMP/frost-clipboard" scripts/native-clipboard-owner.c "$RUNNER_TEMP/frost-clipboard/wlr-data-control-unstable-v1-protocol.c" $(pkg-config --libs wayland-client) -o "$RUNNER_TEMP/frost-clipboard/native-clipboard-owner"
          cc -Wall -Wextra -Werror $(pkg-config --cflags wayland-client) -I"$RUNNER_TEMP/frost-clipboard" scripts/native-pointer.c "$RUNNER_TEMP/frost-clipboard/wlr-virtual-pointer-unstable-v1-protocol.c" $(pkg-config --libs wayland-client) -o "$RUNNER_TEMP/frost-clipboard/native-pointer"
      - name: Exercise actual Wayland bounded clipboard transfers
        timeout-minutes: 10
        env:
          FROST_SMOKE_WAYLAND_DEBUG: "1"
        if: ${{ !cancelled() && steps.clipboard_owner.outcome == 'success' }}
        run: python3 scripts/native-wayland-clipboard.py --runner scripts/native-desktop-smoke.py --binary "$RUNNER_TEMP/frost-installed/bin/frost" --owner "$RUNNER_TEMP/frost-clipboard/native-clipboard-owner" --output native-smoke-artifacts/wayland-clipboard
      - name: Exercise actual clipboard widgets PRIMARY and idle ownership
        if: ${{ !cancelled() && steps.clipboard_owner.outcome == 'success' }}
        run: python3 scripts/native-clipboard-ui.py --runner scripts/native-desktop-smoke.py --binary "$RUNNER_TEMP/frost-installed/bin/frost" --owner "$RUNNER_TEMP/frost-clipboard/native-clipboard-owner" --pointer "$RUNNER_TEMP/frost-clipboard/native-pointer" --output native-smoke-artifacts/wayland-clipboard-ui
      - name: Exercise X11 recovery report and preservation gate
        timeout-minutes: 5
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python3 scripts/native-recovery-report.py --runner scripts/native-desktop-smoke.py --binary "$RUNNER_TEMP/frost-installed/bin/frost" --backend x11 --output native-smoke-artifacts/x11-recovery-report
      - name: Exercise Wayland recovery report and preservation gate
        timeout-minutes: 5
        if: ${{ !cancelled() && steps.clipboard_owner.outcome == 'success' }}
        run: python3 scripts/native-recovery-report.py --runner scripts/native-desktop-smoke.py --binary "$RUNNER_TEMP/frost-installed/bin/frost" --backend wayland --pointer "$RUNNER_TEMP/frost-clipboard/native-pointer" --output native-smoke-artifacts/wayland-recovery-report
      - name: Build isolated native overload acceptance fixture
        id: overload_fixture
        timeout-minutes: 10
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          python3 scripts/native-overload-smoke.py --self-test
          python3 scripts/native-overload-smoke.py --regression-test native-smoke-artifacts/overload-observer-regression
          python3 scripts/build-native-overload-fixture.py --mechanism runner --output native-smoke-artifacts/overload-fixture
      - name: Observe X11 Runner ingress overload, fault UI and explicit close
        timeout-minutes: 3
        if: ${{ !cancelled() && steps.overload_fixture.outcome == 'success' }}
        run: python3 scripts/native-overload-smoke.py --binary native-smoke-artifacts/overload-fixture/native-overload-fixture --manifest native-smoke-artifacts/overload-fixture/manifest.json --backend x11 --output native-smoke-artifacts/x11-overload
      - name: Observe Wayland Runner ingress overload, fault UI and explicit close
        timeout-minutes: 3
        if: ${{ !cancelled() && steps.overload_fixture.outcome == 'success' && steps.clipboard_owner.outcome == 'success' }}
        env:
          FROST_SMOKE_POINTER: ${{ runner.temp }}/frost-clipboard/native-pointer
        run: python3 scripts/native-overload-smoke.py --binary native-smoke-artifacts/overload-fixture/native-overload-fixture --manifest native-smoke-artifacts/overload-fixture/manifest.json --backend wayland --output native-smoke-artifacts/wayland-overload
      - name: Preserve screenshots and PTY evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frost-native-desktop-${{ github.sha }}
          path: |
            native-smoke-artifacts
            !native-smoke-artifacts/overload-fixture/checkout/**
          if-no-files-found: error
          retention-days: 14
