name: Prepare Vim9 core upgrade

on:
  push:
    branches: [master]
    paths: [.github/workflows/vim9-core-upgrade.yml]
  workflow_dispatch:
    inputs:
      core_revision:
        description: Full jterm_core commit SHA
        required: true
        default: 9dc44d8bb521b4d8ad9435e2bd6e09aecdf090b0

permissions:
  contents: write

concurrency:
  group: vim9-core-upgrade-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    uses: beamiter/jterm_core/.github/workflows/prepare-vim9-core.yml@9dc44d8bb521b4d8ad9435e2bd6e09aecdf090b0
    with:
      core_revision: ${{ inputs.core_revision || '9dc44d8bb521b4d8ad9435e2bd6e09aecdf090b0' }}
