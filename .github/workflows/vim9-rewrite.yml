name: Vim9 rewrite validation
on:
  push:
    branches: [work/vim9-rewrite-20261020]
permissions:
  contents: write
concurrency:
  group: vim9-rewrite
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  RUST_BACKTRACE: '1'
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Apply bounded integration edits
        run: python3 scripts/apply-vim9-rewrite.py
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y pkg-config libfontconfig1-dev libwayland-dev libx11-dev libx11-xcb-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxcursor-dev libxi-dev libxrandr-dev libxkbcommon-dev libegl1-mesa-dev libgl1-mesa-dev vim ripgrep xvfb xdotool
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: vim9-rewrite
          cache-on-failure: true
      - name: Format and retain actual product source
        run: |
          cargo fmt --all
          test "$GITHUB_REF_NAME" = work/vim9-rewrite-20261020
          git config user.name 'Frost IDE integration'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src Cargo.toml Cargo.lock deny.toml scripts
          if ! git diff --cached --quiet; then
            git commit -m 'Integrate and format the native Vim9 workbench'
            git push origin HEAD:refs/heads/work/vim9-rewrite-20261020
          fi
          echo "VALIDATED_SOURCE=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git show --stat --oneline HEAD
      - name: Check actual test targets with exact pinned dependencies
        run: cargo check --tests --locked
      - name: Run native workbench unit contracts
        run: cargo test --bin frost --locked vim9_ide::tests -- --test-threads=1
      - name: Run real Vim9 PTY round trip
        run: |
          cargo test --bin frost --locked -- --list --ignored | grep '^vim9_ide::native_tests::real_vim9_native_pty: test$'
          cargo test --bin frost --locked vim9_ide::native_tests::real_vim9_native_pty -- --ignored --exact --test-threads=1
      - name: Confirm clean formatting and report validated commit
        run: |
          cargo fmt --all -- --check
          echo "Validated source commit: $VALIDATED_SOURCE" >> "$GITHUB_STEP_SUMMARY"
