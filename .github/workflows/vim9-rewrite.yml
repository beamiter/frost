name: Vim9 IDE validation
on:
  push:
    branches: [master, work/vim9-rewrite-20261020]
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vim9-ide-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  RUST_BACKTRACE: '1'
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Materialize bundled shared core
        shell: bash
        run: |
          if [[ -f "scripts/materialize-shared-core.sh" ]]; then
            bash "scripts/materialize-shared-core.sh"
          fi
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y pkg-config libfontconfig1-dev libwayland-dev libx11-dev libx11-xcb-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxcursor-dev libxi-dev libxrandr-dev libxkbcommon-dev libxkbcommon-x11-0 libegl1-mesa-dev libgl1-mesa-dev libgl1-mesa-dri mesa-vulkan-drivers vim ripgrep xvfb xdotool xauth imagemagick python3-pil fonts-dejavu-core fonts-noto-cjk
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: vim9-rewrite-compiled
          key: acceptance-v1
          cache-on-failure: true
          cache-workspace-crates: true
      - name: Check committed source formatting
        run: cargo fmt --all -- --check
      - name: Check actual test targets with exact pinned dependencies
        run: cargo check --tests --locked
      - name: Run native workbench unit contracts
        run: cargo test --bin frost --locked vim9_ide::tests -- --test-threads=1
      - name: Run real Vim9 PTY round trip
        run: |
          cargo test --bin frost --locked -- --list --ignored | grep '^vim9_ide::native_tests::real_vim9_native_pty: test$'
          cargo test --bin frost --locked vim9_ide::native_tests::real_vim9_native_pty -- --ignored --exact --test-threads=1
      - name: Build the actual native binary
        id: vim9-build
        run: cargo build --bin frost --locked
      - name: Native XTest window acceptance
        env:
          WGPU_BACKEND: gl
          FROST_VIM9_WINDOW_ARTIFACTS: native-vim9-window-artifacts
        run: xvfb-run -a -s '-screen 0 1600x1000x24' python3 scripts/test-vim9-window.py target/debug/frost
      - name: Native Vim buffer GUI colors and real editing
        if: ${{ !cancelled() && steps.vim9-build.outcome == 'success' }}
        timeout-minutes: 3
        run: |
          xvfb-run -a -s '-screen 0 1600x1100x24' /usr/bin/python3 scripts/native-vim9-buffer-smoke.py \
            --binary target/debug/frost --app frost --output native-vim9-buffer-artifacts
      - name: Clippy on actual test targets
        run: cargo clippy --tests --locked -- -D warnings
      - name: Confirm clean formatting and report validated commit
        run: |
          cargo fmt --all -- --check
          echo "Validated source commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve native window and buffer evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frost-vim9-buffer-${{ github.sha }}
          path: |
            native-vim9-window-artifacts
            native-vim9-buffer-artifacts
          if-no-files-found: warn
          retention-days: 14
