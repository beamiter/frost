name: Scalar query folding validation
on:
  push:
    branches: [diagnostics/scalar-query-folding]
permissions:
  contents: read
jobs:
  search:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: bash scripts/materialize-shared-core.sh
      - run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y pkg-config libfontconfig1-dev libwayland-dev libx11-dev libx11-xcb-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxcursor-dev libxi-dev libxrandr-dev libxkbcommon-dev libegl1-mesa-dev libgl1-mesa-dev
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt,clippy

      - name: Original production must fail real parser regression
        run: |
          set +e
          CARGO_TERM_COLOR=never cargo test -p frost --all-features --locked search::tests::parsed_sigma_queries_match_themselves_in_live_and_history_rows -- --exact --nocapture > /tmp/sigma-negative.log 2>&1
          status=$?
          set -e
          cat /tmp/sigma-negative.log
          test "$status" -ne 0
          grep -q 'parsed_sigma_queries_match_themselves_in_live_and_history_rows ... FAILED' /tmp/sigma-negative.log
      - name: Apply minimal query normalization fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/search.rs')
          s = p.read_text()
          old = '            query.to_lowercase()\n        };'
          new = '            // Match the per-scalar folding used by live cells and history.\n            // str::to_lowercase applies contextual final-sigma rules that\n            // char::to_lowercase does not, so even an identical query can miss.\n            query.chars().flat_map(char::to_lowercase).collect()\n        };'
          assert s.count(old) == 1
          p.write_text(s.replace(old, new))
          PY
          rustfmt --edition 2021 src/search.rs
          echo 'FORMATTED_SEARCH_BEGIN'
          base64 -w0 src/search.rs
          printf '\nFORMATTED_SEARCH_END\n'
      - name: Search regression suite
        run: cargo test -p frost --all-features --locked search::tests -- --nocapture
      - name: Clippy candidate
        run: cargo clippy -p frost --all-targets --all-features --locked -- -D warnings
