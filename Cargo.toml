[package]
name = "jterm3"
version = "0.1.0"
edition = "2021"
description = "A fast, GPU-rendered Linux terminal emulator built with Rust and iced"
repository = "https://github.com/beamiter/jterm3"
homepage = "https://github.com/beamiter/jterm3"
readme = "README.md"
license = "MIT OR Apache-2.0"
keywords = ["terminal", "terminal-emulator", "iced", "gpu", "linux"]
categories = ["command-line-utilities"]

[dependencies]
iced = { version = "0.14", features = ["canvas", "tokio", "advanced", "image", "wgpu"] }
libc = "0.2"
# Pin the shared contract so a branch move cannot silently change a release build.
jterm_core = { git = "https://github.com/beamiter/jterm_core.git", rev = "3855746e9e20a1c3658fb56a069ba6340e45935a" }
tokio = { version = "1", features = ["rt"] }
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
smallvec = "1.15"
base64 = "0.23"
image = "0.25"
once_cell = "1.21"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
dirs = "6.0"
unicode-width = "0.2"
unicode-normalization = "0.1"
lru = "0.18"
regex = "1.13"
fuzzy-matcher = "0.3"
uuid = { version = "1.23", features = ["v4", "serde"] }

[profile.dev]
incremental = true

[profile.dev.package."*"]
opt-level = 1

[profile.release]
lto = "thin"
strip = "symbols"
codegen-units = 1
opt-level = 3
