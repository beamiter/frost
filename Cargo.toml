[package]
name = "frost"
version = "0.1.0"
edition = "2021"
description = "A fast, GPU-rendered Linux terminal emulator built with Rust and iced"
repository = "https://github.com/beamiter/frost"
homepage = "https://github.com/beamiter/frost"
readme = "README.md"
license = "MIT OR Apache-2.0"
# frost ships as a Linux application; its exact-pinned git core is not a
# crates.io dependency, so publishing this manifest there would be unusable.
publish = false
keywords = ["terminal", "terminal-emulator", "iced", "gpu", "linux"]
categories = ["command-line-utilities"]

[dependencies]
iced = { version = "0.14", features = ["canvas", "tokio", "advanced", "image", "wgpu"] }
libc = "0.2"
# Pin the shared contract so a branch move cannot silently change a release build.
jterm_core = { git = "https://github.com/beamiter/jterm_core.git", rev = "3e09b161a36e2ec30f730eee8f8d6702b2bacc35" }
tokio = { version = "1", features = ["rt"] }
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
smallvec = "1.15"
base64 = "0.23"
image = "0.25"
once_cell = "1.21"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
toml = "1.1"
dirs = "6.0"
unicode-width = "0.2"
unicode-normalization = "0.1"
lru = "0.18"
regex = "1.13"
fuzzy-matcher = "0.3"
uuid = { version = "1.23", features = ["v4", "serde"] }
crossbeam-channel = "0.5"
parking_lot = "0.12"

[profile.dev]
incremental = true

[profile.dev.package."*"]
opt-level = 1

[profile.release]
lto = "thin"
strip = "symbols"
codegen-units = 1
opt-level = 3
